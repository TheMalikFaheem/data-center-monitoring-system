# environment.yml — tracked defaults shared by every deployment.
#
# CONTRACT: flat `key: "value"` lines ONLY (parsed by scripts/common.sh:yaml_get).
#
# Per-server values go in environment.local.yml — same format, same directory,
# gitignored. Any key there overrides the value here. NEVER put server-specific
# values in this file; it must stay valid for a fresh Ubuntu 24.04 box.

# ─────────────────────────────────────────────────────────────────────────────
# THE ONE VALUE YOU MUST CHANGE WHEN MOVING TO A NEW SERVER
# ─────────────────────────────────────────────────────────────────────────────
# This is the IP address of the machine running the monitoring stack.
# It is used in:
#   - SSH tunnel instructions printed after install
#   - agent-bootstrap.sh Loki push URL
#   - apply-inventory.sh summary messages
#   - All "how to access" help text throughout the codebase
#
# Override this in configs/environment.local.yml with your real server IP:
#   monitor_server_ip: "192.168.1.50"    ← your local LAN IP
#   monitor_server_ip: "10.0.0.5"        ← or whatever your network uses
#
# The default below is a placeholder. Scripts will still work; only the
# printed SSH tunnel hint will show the wrong IP until you override it.
monitor_server_ip: "YOUR_MONITOR_SERVER_IP"

# ─────────────────────────────────────────────────────────────────────────────
# Service listen addresses.
# 127.0.0.1 = loopback only — nothing reachable from the network.
# Access is via SSH tunnel from your workstation:
#   ssh -L 9090:127.0.0.1:9090 root@<monitor_server_ip>
#   ssh -L 3000:127.0.0.1:3000 root@<monitor_server_ip>
# This is the correct setup for both LAN and internet deployments.
# Only override these if you specifically need LAN-direct access
# (e.g., nginx in front for a team dashboard — see Phase 5 notes below).
# ─────────────────────────────────────────────────────────────────────────────
# Phase 1 — Core
prometheus_listen: "127.0.0.1:9090"
node_exporter_listen: "127.0.0.1:9100"

# Phase 2 — Platform
# Override any of these in environment.local.yml if needed.
alertmanager_listen: "127.0.0.1:9093"
loki_listen: "127.0.0.1:3100"
alloy_listen: "127.0.0.1:12345"
grafana_listen: "127.0.0.1:3000"

# Loki log retention (same format as prometheus_retention).
loki_retention: "30d"

# Alertmanager notification stubs — override in environment.local.yml.
# smtp_smarthost: "smtp.example.com:587"
# smtp_from: "alertmanager@example.com"
# smtp_auth_username: "alertmanager@example.com"
# smtp_auth_password: "changeme"
# alert_email_to: "admin@example.com"

# REQUIRED in environment.local.yml (never commit secrets to git):
# grafana_admin_password: "your_strong_password_here"

# How long Prometheus keeps metric history on disk.
prometheus_retention: "30d"

# How often Prometheus pulls metrics from every target.
scrape_interval: "15s"

# Attached to every metric as an external label (useful once several
# environments feed one Grafana).
external_label_env: "production"

# Phase 3 — Exporters
# Override any of these in environment.local.yml if needed.
blackbox_exporter_listen: "127.0.0.1:9115"
snmp_exporter_listen:     "127.0.0.1:9116"
process_exporter_listen:  "127.0.0.1:9256"
mysqld_exporter_listen:   "127.0.0.1:9104"
postgres_exporter_listen: "127.0.0.1:9187"
redis_exporter_listen:    "127.0.0.1:9121"

# REQUIRED in environment.local.yml for database exporters (never commit):
# mysql_dsn:    "exporter:password@tcp(127.0.0.1:3306)/"
# postgres_dsn: "postgresql://exporter:password@localhost:5432/postgres?sslmode=disable"
# redis_addr:   "redis://localhost:6379"

# Phase 4 — Operations (backup)
# How many backup archives to keep before rotating old ones.
backup_keep: "7"

# Phase 5 — Edge (nginx + HTTPS) — OPTIONAL for LAN deployments
# ─────────────────────────────────────────────────────────────────────────────
# nginx is OPTIONAL when running on a local LAN. You can access everything
# via SSH tunnels without it. Only set these up if you want:
#   a) A web URL like https://monitor.yourdomain.com accessible to the team
#   b) HTTPS with a real SSL certificate
#
# For LAN only: you can skip nginx entirely. SSH tunnel is sufficient.
# For public domain: set these in environment.local.yml:
# nginx_domain:           "monitor.yourdomain.com"   # DNS A record → server IP
# nginx_admin_user:       "admin"                     # basic auth username
# nginx_admin_password:   "your-strong-password"      # basic auth password
# nginx_certbot_email:    "you@example.com"            # optional, cert expiry alerts


# Phase 6 — Watchdog
# Alertmanager URL for the watchdog to POST alerts to.
# Override in environment.local.yml if Alertmanager is on a non-default port.
watchdog_alertmanager_url: "http://127.0.0.1:9093"

# Phase 7 — Alertmanager Notifications
# Telegram bot alerts — set in environment.local.yml (gitignored, never commit):
#   telegram_bot_token: "123456789:ABCDef_your_token_here"
#   telegram_chat_id: "-123456789"    # negative = group chat, positive = direct message
#
# HOW TO CREATE A TELEGRAM BOT:
#   1. Open Telegram → search @BotFather → /newbot → follow prompts
#   2. Copy the bot token shown at the end
#   3. Send any message to your bot (to activate the chat)
#   4. Get your chat ID: https://api.telegram.org/bot<TOKEN>/getUpdates
#      Look for "chat":{"id": <number>}
#   5. Add to configs/environment.local.yml:
#        telegram_bot_token: "your_token"
#        telegram_chat_id: "your_chat_id"
#   6. Re-render alertmanager: sudo ./monitorctl install alertmanager --reinstall

# SNMP community string for polling switches/pfSense/iDRAC.
# Default is "public" — override in environment.local.yml if your devices use a different string.
snmp_community: "public"
