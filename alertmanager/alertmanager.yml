# Alertmanager — decides where alerts go and prevents alert storms.
#
# Out of the box this does nothing except group and de-duplicate.
# To get alerts on your phone you have two choices:
#
#   EASY   -> use Uptime Kuma's built-in notifications (all clicking,
#             no files to edit). GETTING-STARTED.md Step 11.
#
#   FULL   -> enable Telegram here, so the deeper server/disk/SSL
#             alerts reach you too. GETTING-STARTED.md Step 14.

route:
  receiver: default
  group_by: [alertname, host]
  group_wait: 30s          # wait this long to bundle related alerts
  group_interval: 5m       # then send updates no faster than this
  repeat_interval: 4h      # re-nag about unresolved alerts this often

  routes:
    # The Watchdog fires forever by design — never notify a human about it.
    # An external service should watch for its ABSENCE instead.
    - receiver: 'null'
      matchers:
        - alertname = "Watchdog"

receivers:
  - name: default
    # ---------------------------------------------------------------
    # TELEGRAM SETUP (see GETTING-STARTED.md Step 14)
    #   1. Message @BotFather on Telegram, send /newbot, copy the token
    #   2. Save the token:
    #        echo 'PASTE_TOKEN_HERE' > alertmanager/telegram_token
    #   3. Message @userinfobot to get your chat id
    #   4. Delete the # from the 4 lines below and paste your chat id
    #   5. docker compose restart alertmanager
    # ---------------------------------------------------------------
    # telegram_configs:
    #   - bot_token_file: /etc/alertmanager/telegram_token
    #     chat_id: -1001234567890
    #     parse_mode: HTML

  - name: 'null'

# Stops a flood: if a machine is completely unreachable, don't also
# send its disk / memory / CPU alerts. One alert, not forty.
inhibit_rules:
  - source_matchers:
      - alertname = "ExporterDown"
    target_matchers:
      - severity =~ "warning|critical"
    equal: [host]

  - source_matchers:
      - severity = "critical"
    target_matchers:
      - severity = "warning"
    equal: [alertname, host]
