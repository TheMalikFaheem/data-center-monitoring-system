# Phase 0 monitoring stack — see GETTING-STARTED.md
#
# Start:   docker compose up -d
# Stop:    docker compose down
# Logs:    docker compose logs -f
# Status:  docker compose ps

name: monitoring

services:

  # ---------------------------------------------------------------
  # Prometheus — collects and stores all numeric measurements
  # ---------------------------------------------------------------
  prometheus:
    image: prom/prometheus:v3.1.0
    container_name: prometheus
    restart: unless-stopped
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.enable-lifecycle'          # allows config reload without restart
    volumes:
      - ./prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"

  # ---------------------------------------------------------------
  # Grafana — the dashboards you actually look at
  # ---------------------------------------------------------------
  grafana:
    image: grafana/grafana:11.5.2
    container_name: grafana
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD in your .env file}
      - GF_USERS_ALLOW_SIGN_UP=false
      - TZ=${TZ:-UTC}
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

  # ---------------------------------------------------------------
  # Alertmanager — decides who gets told, and stops alert spam
  # ---------------------------------------------------------------
  alertmanager:
    image: prom/alertmanager:v0.28.0
    container_name: alertmanager
    restart: unless-stopped
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
    volumes:
      - ./alertmanager:/etc/alertmanager:ro
      - alertmanager-data:/alertmanager
    ports:
      - "9093:9093"

  # ---------------------------------------------------------------
  # Blackbox exporter — checks websites from the outside in.
  # Gives you up/down, response time and SSL expiry.
  # ---------------------------------------------------------------
  blackbox:
    image: prom/blackbox-exporter:v0.25.0
    container_name: blackbox
    restart: unless-stopped
    command:
      - '--config.file=/etc/blackbox/blackbox.yml'
    volumes:
      - ./blackbox:/etc/blackbox:ro
    ports:
      - "9115:9115"
    cap_add:
      - NET_RAW                            # required for ping (ICMP) checks

  # ---------------------------------------------------------------
  # Node exporter — measures THIS machine (the monitoring server).
  # You will install this same thing on every other server later.
  # ---------------------------------------------------------------
  node-exporter:
    image: prom/node-exporter:v1.8.2
    container_name: node-exporter
    restart: unless-stopped
    pid: host
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/rootfs'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc|rootfs/var/lib/docker)($$|/)'
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    ports:
      - "9100:9100"

  # ---------------------------------------------------------------
  # Uptime Kuma — friendly click-and-go uptime monitoring.
  # Easiest place to start: add a site, get Telegram alerts, done.
  # ---------------------------------------------------------------
  uptime-kuma:
    image: louislam/uptime-kuma:1
    container_name: uptime-kuma
    restart: unless-stopped
    environment:
      - TZ=${TZ:-UTC}
    volumes:
      - uptime-kuma-data:/app/data
    ports:
      - "3001:3001"

volumes:
  prometheus-data:
  grafana-data:
  alertmanager-data:
  uptime-kuma-data:
