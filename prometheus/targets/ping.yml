# Things to ping. Good for devices that have no exporter yet:
# switches, cameras, iDRAC cards, the NVR, your internet gateways.
#
# This is the fastest way to get value on day one — you will know
# within a minute when any of these stops answering.
#
# Use bare IPs or hostnames. No https:// here.

- targets:
    - 1.1.1.1
    - 8.8.8.8
  labels:
    group: internet
    note: upstream-reachability

