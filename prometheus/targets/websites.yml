# Websites to check for up/down, response time and SSL expiry.
#
# HOW TO ADD A SITE:
#   1. Copy one of the blocks below.
#   2. Change the URL. Keep the "- " and the indentation exactly as shown.
#   3. Save, then run:  docker compose exec prometheus kill -HUP 1
#      (Prometheus also picks this file up on its own within 60 seconds.)
#
# Use the FULL url including https://

- targets:
    - https://example.com
  labels:
    group: websites

