# Servers and VMs that have node_exporter installed on them.
#
# The monitoring server itself is already listed below.
#
# HOW TO ADD A SERVER:
#   1. Install node_exporter on it (GETTING-STARTED.md, Step 13).
#   2. Add its IP with :9100 on the end, like the examples.
#   3. Save. Prometheus picks it up within 60 seconds.

- targets:
    - node-exporter:9100
  labels:
    host: monitoring
    role: monitoring

