# Starter alert rules.
#
# Reading a rule:
#   expr  = the condition, in Prometheus' query language
#   for   = how long it must stay true before alerting (stops false alarms)
#
# After editing this file, reload Prometheus:
#   docker compose exec prometheus kill -HUP 1
# Check your rules loaded at:  http://<server-ip>:9090/rules

groups:

  # =================================================================
  # Websites and SSL
  # =================================================================
  - name: websites
    rules:

      - alert: WebsiteDown
        expr: probe_success{job="blackbox-http"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Website DOWN: {{ $labels.instance }}"
          description: "{{ $labels.instance }} has failed its check for 2 minutes."

      - alert: WebsiteSlow
        expr: probe_duration_seconds{job="blackbox-http"} > 5
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Website slow: {{ $labels.instance }}"
          description: "Taking {{ $value | printf \"%.1f\" }}s to respond (limit 5s)."

      - alert: SSLCertExpiringSoon
        expr: (probe_ssl_earliest_cert_expiry - time()) / 86400 < 21
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "SSL expires in {{ $value | printf \"%.0f\" }} days: {{ $labels.instance }}"
          description: "Renew the certificate for {{ $labels.instance }}."

      - alert: SSLCertExpiringCritical
        expr: (probe_ssl_earliest_cert_expiry - time()) / 86400 < 7
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "SSL expires in {{ $value | printf \"%.0f\" }} days: {{ $labels.instance }}"
          description: "Fewer than 7 days left. Renew now."

  # =================================================================
  # Reachability (ping checks)
  # =================================================================
  - name: reachability
    rules:

      - alert: DeviceUnreachable
        expr: probe_success{job="blackbox-icmp"} == 0
        for: 3m
        labels:
          severity: critical
        annotations:
          summary: "No ping response: {{ $labels.instance }} ({{ $labels.group }})"

      - alert: InternetPacketLoss
        expr: avg_over_time(probe_success{group="internet"}[10m]) < 0.9
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Packet loss to {{ $labels.instance }}"
          description: "Over 10% of pings lost in the last 10 minutes."

  # =================================================================
  # Servers
  # =================================================================
  - name: servers
    rules:

      - alert: ExporterDown
        expr: up == 0
        for: 3m
        labels:
          severity: critical
        annotations:
          summary: "Cannot collect from {{ $labels.instance }} (job {{ $labels.job }})"
          description: "Either the machine is down or node_exporter has stopped."

      - alert: DiskSpaceWarning
        expr: |
          100 - (node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs"}
                 / node_filesystem_size_bytes{fstype!~"tmpfs|overlay|squashfs"} * 100) > 85
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Disk {{ $value | printf \"%.0f\" }}% full on {{ $labels.host }} ({{ $labels.mountpoint }})"

      - alert: DiskSpaceCritical
        expr: |
          100 - (node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs"}
                 / node_filesystem_size_bytes{fstype!~"tmpfs|overlay|squashfs"} * 100) > 95
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Disk {{ $value | printf \"%.0f\" }}% FULL on {{ $labels.host }} ({{ $labels.mountpoint }})"

      # Inode exhaustion looks like "disk full" while df shows free space.
      - alert: InodesLow
        expr: |
          100 - (node_filesystem_files_free{fstype!~"tmpfs|overlay|squashfs"}
                 / node_filesystem_files{fstype!~"tmpfs|overlay|squashfs"} * 100) > 90
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Inodes {{ $value | printf \"%.0f\" }}% used on {{ $labels.host }} ({{ $labels.mountpoint }})"

      - alert: MemoryLow
        expr: |
          node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes * 100 < 10
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Only {{ $value | printf \"%.0f\" }}% memory available on {{ $labels.host }}"

      - alert: CPUHigh
        expr: |
          100 - (avg by (instance, host) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 90
        for: 20m
        labels:
          severity: warning
        annotations:
          summary: "CPU {{ $value | printf \"%.0f\" }}% on {{ $labels.host }} for 20 minutes"

      # THE virtual-machine alert. Steal time means the VM asked for CPU
      # and the hypervisor made it wait — the host is oversubscribed.
      # Nothing inside the VM will look wrong except this.
      - alert: CPUStealHigh
        expr: |
          avg by (instance, host) (rate(node_cpu_seconds_total{mode="steal"}[5m])) * 100 > 5
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "CPU steal {{ $value | printf \"%.1f\" }}% on {{ $labels.host }}"
          description: "The Proxmox host is oversubscribed. This VM is waiting for CPU."

      - alert: HostRebooted
        expr: node_time_seconds - node_boot_time_seconds < 300
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.host }} rebooted in the last 5 minutes"

      - alert: ClockDriftHigh
        expr: abs(node_timex_offset_seconds) > 1
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Clock off by {{ $value | printf \"%.1f\" }}s on {{ $labels.host }}"
          description: "Clock drift breaks TLS, authentication and database replication."

      - alert: DiskWillFillIn7Days
        expr: |
          predict_linear(node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs"}[24h], 7*24*3600) < 0
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.mountpoint }} on {{ $labels.host }} will fill within 7 days"
          description: "Based on the last 24 hours of growth. Plan now, not at 3am."

  # =================================================================
  # Watchdog — the "is monitoring itself alive?" alert.
  #
  # This fires CONSTANTLY, forever, on purpose. Something outside
  # this building must watch for it to STOP. See README section 3.
  # =================================================================
  - name: watchdog
    rules:
      - alert: Watchdog
        expr: vector(1)
        labels:
          severity: none
        annotations:
          summary: "Monitoring is alive. If this stops arriving, monitoring is dead."
